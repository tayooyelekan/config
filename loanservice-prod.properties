# Production Database Configuration (override with environment variables)
# Defaults point at the local MySQL so the service also runs on a dev machine.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:loansdb}
spring.datasource.username=${PROD_DB_USERNAME:root}
spring.datasource.password=${PROD_DB_PASSWORD:root}
